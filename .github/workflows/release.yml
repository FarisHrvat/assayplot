name: Release

# Builds every supported desktop target and attaches the installers to a draft
# GitHub release. Triggered by pushing a version tag, or by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.3.0)'
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify before building anything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run licenses
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  build:
    name: ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    # Job-level so the steps' `if` can see them. Secrets aren't allowed in `if`.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # Tauri needs a webkit2gtk development environment on Linux. 22.04 carries
      # webkit2gtk-4.1, which Tauri 2 expects.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev

      - run: npm ci

      # Signing steps skip themselves until the secrets exist. See docs/RELEASING.md.
      - name: Import the Apple certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      # macOS is packaged by our own script: Tauri's DMG step drives Finder over
      # AppleScript, which no CI runner can satisfy.
      # Two steps: an empty APPLE_SIGNING_IDENTITY makes Tauri try to sign with "".
      - name: Build (macOS, unsigned)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE == ''
        run: |
          npx tauri build --target ${{ matrix.target }} --bundles app
          bash scripts/make-dmg.sh ${{ matrix.target }}

      - name: Build (macOS, signed and notarised)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx tauri build --target ${{ matrix.target }} --bundles app
          bash scripts/make-dmg.sh ${{ matrix.target }}

      - name: Build (Windows and Linux)
        if: runner.os != 'macOS'
        run: npx tauri build --target ${{ matrix.target }}

      - name: Fix AppImage permissions
        if: runner.os == 'Linux'
        run: bash ci/fix-appimage.sh ${{ matrix.target }}

      - name: Check AppImage permissions
        if: runner.os == 'Linux'
        run: bash ci/check-appimage.sh ${{ matrix.target }}

      # Windows certs are hardware-backed now, so no .pfx. Azure Trusted Signing.
      - name: Sign the Windows installers
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder: src-tauri/target/${{ matrix.target }}/release/bundle
          files-folder-filter: exe,msi
          files-folder-recurse: true

      # Renames the installers per platform and writes SHA256SUMS.txt.
      - name: Collect artefacts
        shell: bash
        run: bash ci/collect.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: assayplot-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    name: Draft the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f ! -name 'SHA256SUMS.txt' -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt && ls -la
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: AssayPlot ${{ github.event.inputs.tag || github.ref_name }}
          files: release/*
          body: |
            ## Which file

            | Your machine | File |
            |---|---|
            | Mac with Apple Silicon (M1 and later) | `macOS_AppleSilicon_aarch64.dmg` |
            | Mac with an Intel processor | `macOS_Intel_x64.dmg` |
            | Windows | `Windows_x64-setup.exe` |
            | Debian, Ubuntu, Mint | `Linux_Debian-Ubuntu_x64.deb` |
            | Fedora, RHEL, openSUSE | `Linux_Fedora-RHEL_x64.rpm` |
            | Any other Linux | `Linux_x64.AppImage` |

            ## Opening it the first time

            The builds aren't signed yet, so the first launch gets blocked.

            - **macOS**: System Settings, Privacy & Security, scroll down, Open Anyway.
              Right-click then Open stopped working in macOS 15.
            - **Windows**: at the SmartScreen warning, More info, then Run anyway.
            - **Linux**: `chmod +x` the AppImage, or install the `.deb`.

            Check a download with `sha256sum -c SHA256SUMS.txt`.
