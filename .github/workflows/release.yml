name: Release

# Builds every supported desktop target and attaches the installers to a draft
# GitHub release. Triggered by pushing a version tag, or by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.3.0)'
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify before building anything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run licenses
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  build:
    name: ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    # Hoisted to the job: a step's `if` reads job-level env, not the step's own,
    # and the secrets context is not available in `if` at all. This is how a
    # signing step is made to skip itself when nobody has set the certificate.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # Tauri needs a webkit2gtk development environment on Linux. 22.04 carries
      # webkit2gtk-4.1, which Tauri 2 expects.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev

      - run: npm ci

      # Signing is wired but inert until the certificates exist as repository
      # secrets. Each block is a no-op when its secret is unset, so an unsigned
      # build still succeeds and the day a certificate arrives nothing else has
      # to change. docs/RELEASING.md has what to put where.
      - name: Import the Apple certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      # macOS is packaged by our own script: Tauri's DMG step drives Finder over
      # AppleScript, which no CI runner can satisfy.
      #
      # Two steps rather than one with conditional environment: Tauri reads
      # APPLE_SIGNING_IDENTITY as set-but-empty and tries to sign with an
      # identity of "", which fails with "no identity found". The variable has
      # to be absent, not empty, so the unsigned path cannot mention it.
      - name: Build (macOS, unsigned)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE == ''
        run: |
          npx tauri build --target ${{ matrix.target }} --bundles app
          bash scripts/make-dmg.sh ${{ matrix.target }}

      - name: Build (macOS, signed and notarised)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx tauri build --target ${{ matrix.target }} --bundles app
          bash scripts/make-dmg.sh ${{ matrix.target }}

      - name: Build (Windows and Linux)
        if: runner.os != 'macOS'
        run: npx tauri build --target ${{ matrix.target }}

      # Azure Trusted Signing rather than a certificate file: Windows code
      # signing certificates now require hardware-backed key storage, so there
      # is no .pfx to put in a secret any more.
      - name: Sign the Windows installers
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          files-folder: src-tauri/target/${{ matrix.target }}/release/bundle
          files-folder-filter: exe,msi
          files-folder-recurse: true

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p out
          BASE="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$BASE" \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} out/ \;
          ls -la out/

      - name: Checksums
        shell: bash
        run: |
          cd out
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS.txt
          else shasum -a 256 * > SHA256SUMS.txt; fi
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: assayplot-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    name: Draft the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f ! -name 'SHA256SUMS.txt' -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt && ls -la
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: AssayPlot ${{ github.event.inputs.tag || github.ref_name }}
          files: release/*
          body: |
            ## Installing

            These builds are **not code-signed**, so your system will warn you
            on first launch.

            - **macOS** — right-click the app and choose *Open*, then *Open*
              again. Apple Silicon and Intel builds are separate; take the one
              matching your Mac.
            - **Windows** — SmartScreen shows "Windows protected your PC".
              Choose *More info* → *Run anyway*.
            - **Linux** — `chmod +x` the AppImage, or install the `.deb`.

            Verify your download against `SHA256SUMS.txt`.
