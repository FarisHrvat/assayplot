name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency licences
        run: npm run licenses
      - name: Type check
        run: npm run typecheck
      - name: Tests, including the committed R parity fixtures
        run: npm test
      - name: Production build
        run: npm run build

  oracle:
    name: Regenerate the R fixtures and check for drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: r-lib/actions/setup-r@v2
        with:
          # 4.5 or later: the tied rank-test fixtures record the exact
          # conditional distribution R introduced in that version.
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # survival, nlme and MASS ship with R; the rest are the oracles for
          # the mixed model, GEE and ANOSIM. reference.R guards each with
          # requireNamespace, so a missing one drops cases rather than failing,
          # which is exactly what must not happen here.
          packages: |
            any::jsonlite
            any::geepack
            any::vegan
      - name: Every oracle must be present, or the drift check proves nothing
        run: |
          Rscript -e 'for (p in c("jsonlite","survival","nlme","geepack","vegan")) if (!requireNamespace(p, quietly=TRUE)) stop("missing R package: ", p)'
      - run: npm ci
      - name: Regenerate fixtures from R
        run: Rscript validation/generate/reference.R
      - name: Fail if the committed values no longer match R
        run: |
          git show HEAD:validation/fixtures/reference.json > /tmp/committed.json
          node scripts/compare-fixtures.mjs /tmp/committed.json validation/fixtures/reference.json
      - name: Run the suite against the freshly generated fixtures
        run: npm test

  # The same four targets the release builds, so what CI proves and what people
  # download are the same set. A macOS runner produces two of them, which is why
  # this is a list of targets rather than a list of runners.
  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # 22.04 rather than latest: Ubuntu 24.04 cannot resolve
          # libappindicator3-dev, which Tauri's Linux bundler still wants.
          - label: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev
      - run: npm ci
      # macOS is packaged by our own script: Tauri's DMG step drives Finder over
      # AppleScript, which no CI runner can satisfy.
      # CI never signs: it proves the build compiles and bundles on each
      # target. The release workflow is where a certificate, if there is one,
      # gets used.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          npx tauri build --target ${{ matrix.target }} --bundles app
          bash scripts/make-dmg.sh ${{ matrix.target }}

      - name: Build (Windows and Linux)
        if: runner.os != 'macOS'
        run: npx tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: assayplot-${{ matrix.target }}
          # Building for an explicit target puts the bundle under the triple,
          # not under target/release. Erroring rather than warning on an empty
          # match: a green build that produced nothing is worse than a red one.
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
          if-no-files-found: error
