# Tests on every push, the website from main, and the Linux installers for
# version tags. The macOS builds and the release page come from
# ci/gitlab-release.sh, run on a Mac (see docs/RELEASING.md).

stages: [test, build, deploy]

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

test:
  stage: test
  image: node:22-bookworm
  cache:
    key: npm
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run licenses
    - npm run typecheck
    - npm test
    - npm run build

linux:
  stage: build
  image: ubuntu:22.04
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  variables:
    DEBIAN_FRONTEND: noninteractive
    # linuxdeploy is an AppImage itself, and containers have no FUSE.
    APPIMAGE_EXTRACT_AND_RUN: "1"
    TARGET: x86_64-unknown-linux-gnu
  script:
    - apt-get update -qq
    - apt-get install -y -qq curl ca-certificates build-essential file wget
      libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
      libayatana-appindicator3-dev squashfs-tools xdg-utils rpm > /dev/null
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - > /dev/null
    - apt-get install -y -qq nodejs > /dev/null
    - curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    - source "$HOME/.cargo/env"
    - npm ci
    - npx tauri build --target "$TARGET"
    - bash ci/fix-appimage.sh "$TARGET"
    - bash ci/check-appimage.sh "$TARGET"
    - cargo test --manifest-path src-tauri/Cargo.toml --lib
    - bash ci/collect.sh "$TARGET"
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      for file in out/*; do
        name=$(basename "$file")
        [ "$name" = SHA256SUMS.txt ] && continue
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$file" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/assayplot/$VERSION/$name"
        echo "uploaded $name"
      done
  artifacts:
    paths: [out/]
    expire_in: 1 week

pages:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [site/**/*, docs/assets/**/*, .gitlab-ci.yml]
  script:
    - mkdir -p public/assets
    - cp -r site/. public/
    - cp docs/assets/logo.svg docs/assets/wordmark.svg public/assets/
    - cp docs/assets/screen-figure.png docs/assets/screen-analysis.png public/assets/
  artifacts:
    paths: [public]
