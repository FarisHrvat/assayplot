# Builds the desktop app for every supported target and keeps the installers as
# job artifacts. A tagged pipeline also attaches them to a GitLab release.
#
# Linux runs on the free shared runners. macOS and Windows hosted runners are a
# paid tier on GitLab.com, so those jobs are manual and sit unstarted when no
# runner can take them. docs/GITLAB.md covers pointing them at your own machine
# instead.

stages: [check, build, release]

variables:
  GIT_DEPTH: "0"
  CARGO_TERM_COLOR: always
  # Keep cargo and npm inside the project so they can be cached between runs.
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  npm_config_cache: $CI_PROJECT_DIR/.npm

.node_cache: &node_cache
  key:
    files: [package-lock.json]
  paths: [.npm/, node_modules/]

.rust_cache: &rust_cache
  key: "cargo-$CI_JOB_NAME"
  paths: [.cargo/, src-tauri/target/]

# ---------------------------------------------------------------- check

check:
  stage: check
  image: node:22-bookworm
  cache:
    - <<: *node_cache
  script:
    - npm ci
    - npm run licenses
    - npm run typecheck
    - npm test
    - npm run build

# ---------------------------------------------------------------- build

# Debian rather than Alpine: Tauri links against webkit2gtk, which musl does
# not carry.
build:linux:
  stage: build
  image: node:22-bookworm
  needs: [check]
  cache:
    - <<: *node_cache
    - <<: *rust_cache
  before_script:
    - apt-get update
    - >
      apt-get install -y --no-install-recommends
      libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential
      curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    - export PATH="$CARGO_HOME/bin:$PATH"
    - npm ci
  script:
    - export PATH="$CARGO_HOME/bin:$PATH"
    - npx tauri build --target x86_64-unknown-linux-gnu
    - bash ci/collect.sh x86_64-unknown-linux-gnu
  artifacts:
    name: assayplot-linux-x64
    paths: [out/]
    expire_in: 30 days

build:macos-arm:
  extends: .macos
  variables:
    RUST_TARGET: aarch64-apple-darwin
  artifacts:
    name: assayplot-macos-apple-silicon
    paths: [out/]
    expire_in: 30 days

build:macos-intel:
  extends: .macos
  variables:
    RUST_TARGET: x86_64-apple-darwin
  artifacts:
    name: assayplot-macos-intel
    paths: [out/]
    expire_in: 30 days

.macos:
  stage: build
  needs: [check]
  # A hosted macOS runner, or your own Mac registered with this tag.
  tags: [saas-macos-medium-m1]
  image: macos-14-xcode-15
  when: manual
  allow_failure: true
  cache:
    - <<: *node_cache
    - <<: *rust_cache
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustup target add "$RUST_TARGET"
    - npm ci
  script:
    - export PATH="$CARGO_HOME/bin:$PATH"
    # --bundles app, then our own disk image: Tauri's DMG step drives Finder
    # over AppleScript, which no build machine can satisfy.
    - npx tauri build --target "$RUST_TARGET" --bundles app
    - bash scripts/make-dmg.sh "$RUST_TARGET"
    - bash ci/collect.sh "$RUST_TARGET"

build:windows:
  stage: build
  needs: [check]
  tags: [saas-windows-medium-amd64]
  when: manual
  allow_failure: true
  cache:
    - <<: *node_cache
    - <<: *rust_cache
  before_script:
    - choco install -y rustup.install nodejs-lts
    - $env:PATH = "$env:CARGO_HOME\bin;$env:PATH"
    - rustup default stable
    - npm ci
  script:
    - $env:PATH = "$env:CARGO_HOME\bin;$env:PATH"
    - npx tauri build --target x86_64-pc-windows-msvc
    - bash ci/collect.sh x86_64-pc-windows-msvc
  artifacts:
    name: assayplot-windows-x64
    paths: [out/]
    expire_in: 30 days

# ---------------------------------------------------------------- release

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build:linux
      artifacts: true
    - job: build:macos-arm
      artifacts: true
      optional: true
    - job: build:macos-intel
      artifacts: true
      optional: true
    - job: build:windows
      artifacts: true
      optional: true
  script:
    - echo "Attaching $(ls -1 out | wc -l) file(s) to $CI_COMMIT_TAG"
    - cat out/SHA256SUMS.txt
  release:
    tag_name: $CI_COMMIT_TAG
    name: AssayPlot $CI_COMMIT_TAG
    description: |
      Installers built from $CI_COMMIT_SHA.

      Verify a download against the checksums in the job artifacts:
      `sha256sum -c SHA256SUMS.txt`.

      Builds are unsigned. macOS: right-click the app and choose Open, then
      Open again. Windows: More info, then Run anyway.
