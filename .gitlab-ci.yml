# Tests on every push, the website from main, and installers for all four
# platforms on version tags. The tag's message becomes the release notes.
# Installers can also be built without releasing: start a pipeline by hand
# (Build > Pipelines > Run pipeline).

stages: [test, build, release, deploy]

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

.installers:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/
  artifacts:
    paths: [out/]
    expire_in: 1 week

test:
  stage: test
  image: node:22-bookworm
  cache:
    key: npm
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run licenses
    - npm run typecheck
    - npm test
    - npm run build

linux:
  extends: .installers
  image: ubuntu:22.04
  variables:
    DEBIAN_FRONTEND: noninteractive
    # linuxdeploy is an AppImage itself, and containers have no FUSE.
    APPIMAGE_EXTRACT_AND_RUN: "1"
    TARGET: x86_64-unknown-linux-gnu
  script:
    - apt-get update -qq
    - apt-get install -y -qq curl ca-certificates build-essential file wget
      libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
      libayatana-appindicator3-dev squashfs-tools xdg-utils rpm > /dev/null
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - > /dev/null
    - apt-get install -y -qq nodejs > /dev/null
    - curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    - source "$HOME/.cargo/env"
    - npm ci
    - npx tauri build --target "$TARGET"
    - bash ci/fix-appimage.sh "$TARGET"
    - bash ci/check-appimage.sh "$TARGET"
    - cargo test --manifest-path src-tauri/Cargo.toml --lib
    - bash ci/collect.sh "$TARGET"
    - bash ci/upload.sh

macos:
  extends: .installers
  tags: [saas-macos-medium-m1]
  image: macos-15-xcode-16
  parallel:
    matrix:
      - TARGET: [aarch64-apple-darwin, x86_64-apple-darwin]
  script:
    - command -v node >/dev/null || brew install node@22
    - export PATH="$(brew --prefix node@22 2>/dev/null)/bin:$PATH"
    - curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    - source "$HOME/.cargo/env"
    - rustup target add "$TARGET"
    - npm ci
    # Tauri's own DMG step drives Finder, which a CI machine can't do.
    - npx tauri build --target "$TARGET" --bundles app
    - bash scripts/make-dmg.sh "$TARGET"
    - bash ci/collect.sh "$TARGET"
    - bash ci/upload.sh

windows:
  extends: .installers
  tags: [saas-windows-medium-amd64]
  variables:
    TARGET: x86_64-pc-windows-msvc
  script:
    - choco install nodejs-lts -y --no-progress | Out-Null
    - Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - .\rustup-init.exe -y --profile minimal --default-toolchain stable | Out-Null
    - $env:Path = "$env:USERPROFILE\.cargo\bin;C:\Program Files\nodejs;$env:Path"
    - npm ci
    - npx tauri build --target $env:TARGET
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    # Git Bash, wherever this runner has Git installed, or a fresh one.
    - $bash = Join-Path (git --exec-path) "..\..\..\bin\bash.exe"
    - if (-not (Test-Path $bash)) { choco install git -y --no-progress | Out-Null; $bash = "C:\Program Files\Git\bin\bash.exe" }
    - '& $bash ci/collect.sh $env:TARGET'
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - '& $bash ci/upload.sh'
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

release:
  stage: release
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs: [linux, macos, windows]
  script:
    - apk add --no-cache bash curl jq > /dev/null
    - bash ci/release.sh

pages:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [site/**/*, docs/assets/**/*, docs/GUIDE.md, docs/VALIDATION.md, scripts/build-site-docs.py, .gitlab-ci.yml]
  script:
    - apk add --no-cache pandoc-cli python3 > /dev/null
    - mkdir -p public/assets
    - cp -r site/. public/
    - python3 scripts/build-site-docs.py public
    - cp docs/assets/logo.svg docs/assets/wordmark.svg public/assets/
    - cp docs/assets/screen-figure.png docs/assets/screen-analysis.png public/assets/
    - cp docs/assets/screen-figure.webp docs/assets/screen-analysis.webp docs/assets/og-image.png public/assets/
  artifacts:
    paths: [public]
