[package]
name = "assayplot"
version = "0.1.0"
description = "Local-first scientific data analysis and graphing"
authors = ["AssayPlot contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "assayplot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
