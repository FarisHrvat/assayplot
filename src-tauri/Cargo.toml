[package]
name = "assayplot"
version = "0.4.0"
description = "Local-first scientific data analysis and graphing"
authors = ["AssayPlot contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "assayplot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Notion's API sends no CORS headers, so a webview cannot call it directly.
# Requests go out through Rust instead, restricted to api.notion.com by the
# capability in capabilities/.
tauri-plugin-http = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
